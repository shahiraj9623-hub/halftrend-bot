name: TestTwelve
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python test_twelve.py
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
